
name: Build THE INFINIT MARKET

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar plugin
        run: mvn -B clean package

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: THE-INFINIT-MARKET-v1.0
          path: target/the-infinit-market-1.0.0.jar
